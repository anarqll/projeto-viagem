    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="aviao.ico" type="image/x-icon">

    <title> Países que visitei </title>

    <link rel="stylesheet" href="galeria.css">

<body>

    <h1> Países que visitei </h1>
    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="inputPesquisa" placeholder="Pesquisar" onkeyup="filtrarPaises()">
        </div>
    </div>

    <aside class="sidebar">
        <button class="btn-home" onclick="mostrarGaleria()" title="Voltar ao Início">
            <i class="fas fa-home"></i>
        </button>
        <div class="dropdown">
            <button class="btn-menu" title="Menu de Opções">
                <i class="fas fa-bars"></i>
            </button>
            <div id="myDropdown" class="dropdown-content">
                <a href="#" onclick="fecharMenu()">Galeria</a>
                <a href="#" onclick="fecharMenu()">Passeios</a>
                <a href="#" onclick="fecharMenu()">Dicas</a>
                <a href="#" onclick="fecharMenu()">Restaurantes/Cafés</a>
                <a href="#" onclick="fecharMenu()"><b>+ Criar Pasta </b></a>
            </div>
        </div>
    </aside> <!-- aside é uma tag usada em Menu -->

    <button class="btn-topo" onclick="voltarAoTopo()" title="Voltar ao topo">
        <i class="fas fa-arrow-up"></i>

    </button>

    <!-- BALÕES -->
    <div class="baloes">
        <button onclick="mostrarGaleria('peru')">Peru</button>
        <button onclick="mostrarGaleria('estonia')">Estônia</button>
        <button onclick="mostrarGaleria('inglaterra')"> Inglaterra </button>
        <button onclick="mostrarGaleria('portugal')"> Portugal </button>
