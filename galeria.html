<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="aviao.ico" type="image/x-icon">

    <title> Países que visitei </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px
        }

        /* BOTÕES (BALÕES) */
        .baloes {
            margin: 20px;
        }

        button {
            background-color: chocolate;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #baa085;
        }

        /* BOTÃO HOME (FIXO ESQUERDA) */
        .btn-home {
            background-color: #ec9c1c;
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%
        }

        /* BOTÃO VOLTAR AO TOPO (FIXO DIREITA) */
        .btn-topo {
            background-color: #e0a11b;
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            padding: 0;
            display: flex;
            align-items: center;
            border-radius: 50%;
            box-shadow: 2px 2px 10px rgba (0, 0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            
        }

        /* Ajuste do tamanho dos ícones dentro dos círculos */
        .btn-home i, .btn-topo i {
            font-size: 20px;
        }

        .baloes {
            margin: 60px 20px 20px 20px;
            /* Margem superior maior para não cobrir o título */
        }

        /* GALERIAS */
        .galeria {
            display: none;
            margin: 30px auto;
            width: 80%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;

        }

        .grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        /*Responsividade para celular */

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .btn-home {
                top: 10px;
                left: 10px;
            }

        }
    </style>
</head>

<body>

    <h1> Países que visitei </h1>

    <button class="btn-home" onclick="mostrarGaleria()" title="Voltar ao Início">
        <i class="fas fa-home"></i>
    </button>

    <button class="btn-topo" onclick="voltarAoTopo()" title="Voltar ao topo">
        <i class="fas fa-arrow-up"></i>

    </button>

    <!-- BALÕES -->
    <div class="baloes">
        <button onclick="mostrarGaleria('peru')">Peru</button>
        <button onclick="mostrarGaleria('estonia')">Estônia</button>
        <button onclick="mostrarGaleria('inglaterra')"> Inglaterra </button>
        <button onclick="mostrarGaleria('portugal')"> Portugal </button>
        <button onclick="mostrarGaleria('espanha')"> Espanha </button>

    </div>

    <!--GALERIA PERU-->

    <div id="peru" class="galeria">
        <h2> Peru </h2>
        <div class="grid">
            <img src="peru imagens/peru1.jpg">
            <img src="peru imagens/peru2.jpg">
            <img src="peru imagens/peru3.jpg">
            <img src="peru imagens/peru4.jpg">
            <img src="peru imagens/peru5.jpg">
            <img src="peru imagens/peru6.jpg">
            <img src="peru imagens/peru7.jpg">
            <img src="peru imagens/peru8.jpg">
            <img src="peru imagens/peru9.jpg">

        </div>

    </div>

    <!--GALERIA ESTONIA -->
    <div id="estonia" class="galeria">
        <h2> Estônia </h2>
        <div class="grid">
            <img src="estonia imagens/estonia1.JPG">
            <img src="estonia imagens/estonia2.JPG">
            <img src="estonia imagens/estonia3.JPG">
            <img src="estonia imagens/estonia4.JPG">
            <img src="estonia imagens/estonia5.JPG">
            <img src="estonia imagens/estonia6.JPG">
            <img src="estonia imagens/estonia7.jpg">
            <img src="estonia imagens/estonia8.jpg">
            <img src="estonia imagens/estonia9.jpg">
            <img src="estonia imagens/estonia10.jpg">
            <img src="estonia imagens/estonia11.jpg">
            <img src="estonia imagens/estonia12.jpg">

        </div>
    </div>

    <!-- GALERIA INGLATERRA -->
    <div id="inglaterra" class="galeria">
        <h2> Inglaterra </h2>
        <div class="grid">
            <img src="inglaterra imagens/inglaterra1.jpg">
            <img src="inglaterra imagens/inglaterra2.jpg">
            <img src="inglaterra imagens/inglaterra3.jpg">
            <img src="inglaterra imagens/inglaterra5.jpg">
            <img src="inglaterra imagens/inglaterra6.JPG">
            <img src="inglaterra imagens/inglaterra7.JPG">
            <img src="inglaterra imagens/inglaterra9.JPG">
            <img src="inglaterra imagens/inglaterra10.JPG">
            <img src="inglaterra imagens/inglaterra11.JPG">
            <img src="inglaterra imagens/inglaterra12.JPG">
        </div>

    </div>

    <!--GALERIA PORTUGAL-->

    <div id="portugal" class="galeria">
        <h2> Portugal </h2>
        <div class="grid">
            <img src="portugal imagens/portugal1.jpg">
            <img src="portugal imagens/portugal2.jpg">
            <img src="portugal imagens/portugal3.jpg">
            <img src="portugal imagens/portugal4.jpg">
            <img src="portugal imagens/portugal5.jpg">
            <img src="portugal imagens/portugal6.jpg">
            <img src="portugal imagens/portugal7.jpg">
            <img src="portugal imagens/portugal8.jpg">
            <img src="portugal imagens/portugal9.jpg">

        </div>
    </div>

    <!--GALERIA ESPANHA -->

    <div id="espanha" class="galeria">
        <h2> Espanha </h2>
        <div class="grid">
            <img src="espanha imagens/espanha1.jpg">
            <img src="espanha imagens/espanha2.jpg">
            <img src="espanha imagens/espanha3.jpg">
            <img src="espanha imagens/espanha4.JPG">
            <img src="espanha imagens/espanha5.jpg">
            <img src="espanha imagens/espanha6.jpg">
            <img src="espanha imagens/espanha7.jpg">
            <img src="espanha imagens/espanha8.JPG">
            <img src="espanha imagens/espanha9.jpg">
            <img src="espanha imagens/espanha10.JPG">

        </div>
    </div>


    <script>
        function mostrarGaleria(pais) {
            // esconde todas as galerias

            document.querySelectorAll('.galeria').forEach(g => {
                g.style.display = 'none';
            });

            // se um páis for selecionado, mostra ele e rola a página

            if (pais !=='') {
                const alvo = document.getElementById(pais);
                if (alvo) {
                    alvo.style.display = 'block';
                    alvo.scrollIntoView();
                }
            }

        } 

        // Função indepedente para voltar ao topo

        function voltarAoTopo() {
            window.scrollTo ({
                top:0,
            });
        }

    </script>

</body>

</html>
