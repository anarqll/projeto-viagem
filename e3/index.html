<!DOCTYPE html>
<html>
<head>
<style>
  /* O POST É UM BLOCO (Um abaixo do outro) */
  .post-container {
    display: block; 
    width: 400px;
    border: 1px solid #dbdbdb;
    margin-bottom: 20px;
    font-family: Arial, sans-serif;
  }

  .foto-post {
    width: 100%;
    height: 400px;
    background-color: #fafafa;
    display: block; /* A foto ocupa o bloco central */
  }

  .legenda-area {
    padding: 10px;
  }

  /* NOME E TEXTO SÃO INLINE (Um ao lado do outro) */
  .username {
    display: inline;
    font-weight: bold;
    margin-right: 5px;
  }

  .texto-legenda {
    display: inline;
  }

  /* BOTÕES DE INTERAÇÃO (Inline-block: Lado a lado com tamanho) */
  .botao-interacao {
    display: inline-block;
    width: 24px;
    height: 24px;
    margin: 10px 5px;
    background-color: #eee;
    border-radius: 50%;
  }
</style>
</head>
<body>

  <div class="post-container">
    <div class="foto-post"></div> <div class="botao-interacao"></div> <div class="botao-interacao"></div> <div class="legenda-area">
      <div class="username">anamacedo</div> <div class="texto-legenda">Explorando a Tailândia! 🌴</div> </div>
  </div>

  <div class="post-container">
    <div class="foto-post"></div>
    <div class="legenda-area">
      <div class="username">viagens_pelomundo</div>
      <div class="texto-legenda">Que lugar incrível!</div>
    </div>
  </div>

</body>
</html>
